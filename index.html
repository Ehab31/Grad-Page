<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>سلحوفة اتخرجت 🎓❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;
      overflow-y: auto;

      font-family: Tahoma, Arial, sans-serif;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(255,255,255,.08),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(212,175,55,.12),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #070b17,
          #0c1324,
          #111a2f
        );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      padding: 24px 0;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .glow {
      position: absolute;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      filter: blur(110px);

      background:
        rgba(212,175,55,.13);

      animation:
        glowMove 9s infinite alternate ease-in-out;
    }

    .glow.one {
      top: -170px;
      right: -140px;
    }

    .glow.two {
      bottom: -170px;
      left: -140px;

      background:
        rgba(95,132,255,.12);

      animation-delay: -4s;
    }

    @keyframes glowMove {
      from {
        transform:
          translate(0, 0)
          scale(1);
      }

      to {
        transform:
          translate(110px, 80px)
          scale(1.16);
      }
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .5;
    }

    .star {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: white;

      animation:
        twinkle 2s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      from {
        opacity: .2;
        transform: scale(.8);
      }

      to {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* =========================
       CARD
    ========================= */

    .card {
      width: min(92%, 600px);

      min-height: 500px;
      max-height: none;

      padding: 48px 34px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.08),
          rgba(255,255,255,.035)
        );

      border:
        1px solid rgba(255,255,255,.13);

      border-radius: 34px;

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 35px 100px rgba(0,0,0,.4);

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      position: relative;
      z-index: 10;

      overflow: hidden;
    }

    .card::before {
      content: "";

      position: absolute;

      width: 280px;
      height: 280px;

      top: -190px;
      right: -90px;

      border-radius: 50%;

      background:
        rgba(212,175,55,.08);

      pointer-events: none;
    }

    .fade {
      width: 100%;

      animation:
        fadeIn .65s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;

        transform:
          translateY(22px)
          scale(.985);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    .icon {
      font-size: 70px;

      margin-bottom: 20px;

      animation:
        float 2.3s infinite ease-in-out;
    }

    @keyframes float {
      0%,
      100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-9px);
      }
    }

    h1 {
      font-size:
        clamp(30px, 7vw, 48px);

      line-height: 1.45;

      margin-bottom: 18px;
    }

    p {
      font-size: 17px;

      line-height: 2;

      opacity: .88;

      max-width: 470px;

      margin:
        0 auto 28px;
    }

    .highlight {
      color: #f4d77d;
    }

    .small-text {
      margin-top: 18px;

      font-size: 13px;

      opacity: .5;
    }

    /* =========================
       BUTTONS
    ========================= */

    button {
      border: 0;
      outline: 0;

      cursor: pointer;

      font-family: inherit;

      font-size: 16px;

      font-weight: 700;

      padding: 14px 28px;

      border-radius: 999px;

      transition: .25s ease;
    }

    .main-btn,
    .save-btn {
      background:
        linear-gradient(
          135deg,
          #f3df95,
          #d6b54c
        );

      color: #111827;

      box-shadow:
        0 14px 40px
        rgba(212,175,55,.18);
    }

    .main-btn:hover,
    .save-btn:hover {
      transform:
        translateY(-3px)
        scale(1.04);

      box-shadow:
        0 18px 50px
        rgba(212,175,55,.28);
    }

    .main-btn:active,
    .save-btn:active {
      transform: scale(.98);
    }

    /* =========================
       MUSIC
    ========================= */

    .music-btn {
      position: fixed;

      top: 18px;
      left: 18px;

      z-index: 300;

      width: 48px;
      height: 48px;

      padding: 0;

      display: grid;
      place-items: center;

      color: white;

      background:
        rgba(255,255,255,.07);

      border:
        1px solid rgba(255,255,255,.12);

      backdrop-filter: blur(12px);

      box-shadow:
        0 10px 30px rgba(0,0,0,.2);
    }

    /* =========================
       TIMELINE
    ========================= */

    .timeline {
      width: 100%;
      max-width: 440px;

      margin:
        10px auto 25px;
    }

    .timeline-item {
      display: flex;

      align-items: center;

      gap: 14px;

      margin: 18px 0;

      text-align: right;
    }

    .dot {
      min-width: 12px;

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: #e6c65f;

      box-shadow:
        0 0 18px rgba(230,198,95,.65);
    }

    .timeline-text {
      padding: 12px 16px;

      width: 100%;

      border-radius: 16px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.08);

      font-size: 15px;

      line-height: 1.7;
    }

    /* =========================
       CERTIFICATE
    ========================= */

    .certificate-wrapper {
      width: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
    }

    .certificate {
      width: min(100%, 470px);

      background:
        linear-gradient(
          145deg,
          #fffaf0,
          #f6ecd0
        );

      color: #172033;

      border-radius: 26px;

      padding: 32px 28px;

      position: relative;

      overflow: hidden;

      box-shadow:
        0 28px 70px rgba(0,0,0,.28);

      border:
        1px solid rgba(212,175,55,.5);
    }

    .certificate::before {
      content: "";

      position: absolute;

      inset: 10px;

      border:
        1px solid rgba(176,137,33,.3);

      border-radius: 20px;

      pointer-events: none;
    }

    .certificate-icon {
      font-size: 42px;

      margin-bottom: 10px;
    }

    .certificate-title {
      font-size: 25px;

      font-weight: 900;

      margin-bottom: 6px;

      letter-spacing: 1px;
    }

    .certificate-subtitle {
      font-size: 11px;

      letter-spacing: 3px;

      opacity: .5;

      margin-bottom: 24px;
    }

    .certificate-line {
      border-top:
        1px solid rgba(23,32,51,.14);

      margin: 20px 0;
    }

    .certificate-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 18px;

      margin: 14px 0;

      font-size: 15px;
    }

    .certificate-row span:first-child {
      opacity: .5;
    }

    .certificate-row span:last-child {
      font-weight: 800;
      text-align: left;
    }

    .status {
      display: inline-block;

      margin-top: 12px;

      padding: 10px 18px;

      border-radius: 999px;

      background: #172033;

      color: #f4d77d;

      font-weight: 900;

      font-size: 12px;

      letter-spacing: 1px;
    }

    .signature {
      margin-top: 20px;

      font-size: 13px;

      opacity: .55;
    }

    .save-btn {
      margin-top: 24px;
    }

    /* =========================
       CONFETTI
    ========================= */

    .confetti {
      position: fixed;

      top: -20px;

      width: 9px;
      height: 14px;

      z-index: 1000;

      pointer-events: none;

      animation:
        confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform:
          translateY(120vh)
          rotate(720deg);

        opacity: 0;
      }
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      bottom: 28px;
      left: 50%;

      transform:
        translate(-50%, 140px);

      z-index: 1500;

      max-width:
        calc(100% - 30px);

      background: #fff;

      color: #111827;

      padding: 13px 20px;

      border-radius: 999px;

      font-weight: 700;

      transition: .35s ease;

      box-shadow:
        0 16px 45px rgba(0,0,0,.2);

      white-space: nowrap;
    }

    .toast.show {
      transform:
        translate(-50%, 0);
    }

    /* =========================
       TABLET / MOBILE
    ========================= */

    @media (max-width: 768px) {

      body {
        padding: 14px 0;

        align-items: flex-start;
      }

      .card {
        width:
          calc(100% - 24px);

        min-height:
          calc(100dvh - 28px);

        margin:
          14px auto;

        padding:
          34px 22px;

        border-radius:
          28px;
      }

      h1 {
        font-size:
          clamp(28px, 7vw, 38px);
      }

      p {
        font-size:
          16px;

        line-height:
          1.9;
      }

      .icon {
        font-size:
          60px;
      }

      .timeline {
        max-width:
          100%;
      }

      .certificate {
        max-width:
          100%;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        padding: 10px 0;

        align-items:
          flex-start;
      }

      .card {
        width:
          calc(100% - 20px);

        min-height:
          calc(100dvh - 20px);

        max-height:
          none;

        margin:
          10px auto;

        padding:
          30px 18px;

        border-radius:
          24px;

        justify-content:
          center;

        overflow:
          visible;
      }

      h1 {
        font-size:
          clamp(26px, 8vw, 34px);

        line-height:
          1.4;
      }

      p {
        font-size:
          15px;

        line-height:
          1.85;
      }

      .icon {
        font-size:
          54px;

        margin-bottom:
          16px;
      }

      .small-text {
        font-size:
          12px;
      }

      .timeline {
        max-width:
          100%;

        margin-top:
          6px;
      }

      .timeline-item {
        gap:
          10px;

        margin:
          14px 0;
      }

      .dot {
        min-width:
          10px;

        width:
          10px;

        height:
          10px;
      }

      .timeline-text {
        font-size:
          14px;

        padding:
          11px 13px;
      }

      .main-btn,
      .save-btn {
        width:
          100%;

        max-width:
          270px;

        padding:
          13px 20px;

        font-size:
          15px;
      }

      .certificate {
        width:
          100%;

        max-width:
          100%;

        padding:
          24px 16px;

        border-radius:
          20px;
      }

      .certificate::before {
        inset:
          7px;

        border-radius:
          16px;
      }

      .certificate-icon {
        font-size:
          38px;
      }

      .certificate-title {
        font-size:
          20px;

        line-height:
          1.3;
      }

      .certificate-subtitle {
        font-size:
          9px;

        letter-spacing:
          2px;
      }

      .certificate-row {
        font-size:
          13px;

        gap:
          10px;

        margin:
          12px 0;
      }

      .certificate-row span:first-child {
        min-width:
          88px;
      }

      .certificate-row span:last-child {
        text-align:
          left;

        word-break:
          break-word;
      }

      .status {
        font-size:
          11px;

        padding:
          9px 15px;
      }

      .signature {
        font-size:
          12px;
      }

      .music-btn {
        top:
          12px;

        left:
          12px;

        width:
          44px;

        height:
          44px;

        font-size:
          16px;
      }

      .toast {
        bottom:
          15px;

        width:
          calc(100% - 30px);

        max-width:
          360px;

        white-space:
          normal;

        text-align:
          center;

        font-size:
          14px;
      }
    }

    /* =========================
       VERY SMALL MOBILES
    ========================= */

    @media (max-width: 380px) {

      .card {
        padding:
          25px 14px;
      }

      h1 {
        font-size:
          24px;
      }

      p {
        font-size:
          14px;
      }

      .icon {
        font-size:
          48px;
      }

      .timeline-text {
        font-size:
          13px;
      }

      .certificate {
        padding:
          22px 13px;
      }

      .certificate-title {
        font-size:
          18px;
      }

      .certificate-row {
        font-size:
          12px;
      }

      .certificate-row span:first-child {
        min-width:
          75px;
      }

      .main-btn,
      .save-btn {
        max-width:
          240px;
      }
    }

    /* =========================
       SHORT SCREENS
    ========================= */

    @media (max-height: 700px) and (max-width: 600px) {

      .card {
        justify-content:
          flex-start;

        min-height:
          auto;
      }

      .icon {
        margin-top:
          8px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
  </div>

  <div class="stars" id="stars"></div>

  <!-- MUSIC -->
  <audio
    id="bgMusic"
    loop
    preload="auto"
  >
    <source
      src="./experience.mp3"
      type="audio/mpeg"
    />
  </audio>

  <button
    class="music-btn"
    id="musicBtn"
    onclick="toggleMusic(event)"
    aria-label="تشغيل أو إيقاف الموسيقى"
  >
    🔇
  </button>

  <!-- MAIN CARD -->
  <main
    class="card"
    id="card"
  >

    <div class="fade">

      <div class="icon">
        🎓
      </div>

      <h1>
        أخيرًا يا سلحوفة 🎓
      </h1>

      <p>
        بعد شغل ودراسة وامتحانات وضغط...
        <br>
        وصلنا لليوم ده أخيرًا ❤️
      </p>

      <button
        class="main-btn"
        onclick="startJourney()"
      >
        يلا نفتكر الرحلة ✨
      </button>

      <div class="small-text">
        Salhofa graduation day 🎓❤️
      </div>

    </div>

  </main>

  <div
    class="toast"
    id="toast"
  ></div>

  <script>

    /* ==========================================
       ELEMENTS
    ========================================== */

    const card =
      document.getElementById("card");

    const music =
      document.getElementById("bgMusic");

    const musicBtn =
      document.getElementById("musicBtn");

    const toast =
      document.getElementById("toast");

    const stars =
      document.getElementById("stars");


    let musicStarted =
      false;


    /* ==========================================
       MUSIC SETTINGS
    ========================================== */

    const MUSIC_START_TIME =
      12;

    const MUSIC_VOLUME =
      0.38;


    /* ==========================================
       STARS
    ========================================== */

    function createStars() {

      for (
        let i = 0;
        i < 55;
        i++
      ) {

        const star =
          document.createElement("span");

        star.className =
          "star";

        star.style.left =
          Math.random() * 100 + "%";

        star.style.top =
          Math.random() * 100 + "%";

        star.style.animationDelay =
          Math.random() * 3 + "s";

        star.style.animationDuration =
          1.5 + Math.random() * 2 + "s";

        stars.appendChild(
          star
        );

      }

    }

    createStars();


    /* ==========================================
       MUSIC
    ========================================== */

    async function startMusic() {

      if (musicStarted) {
        return;
      }

      try {

        music.volume =
          MUSIC_VOLUME;

        music.currentTime =
          MUSIC_START_TIME;

        await music.play();

        musicStarted =
          true;

        musicBtn.textContent =
          "🔊";

      }

      catch (error) {

        musicBtn.textContent =
          "🔇";

      }

    }


    async function toggleMusic(event) {

      if (event) {
        event.stopPropagation();
      }

      if (music.paused) {

        try {

          if (!musicStarted) {

            music.currentTime =
              MUSIC_START_TIME;

          }

          music.volume =
            MUSIC_VOLUME;

          await music.play();

          musicStarted =
            true;

          musicBtn.textContent =
            "🔊";

        }

        catch (error) {

          console.log(error);

        }

      }

      else {

        music.pause();

        musicBtn.textContent =
          "🔇";

      }

    }


    document.addEventListener(
      "pointerdown",
      startMusic,
      {
        once: true
      }
    );


    /* ==========================================
       STEP 1 - JOURNEY
    ========================================== */

    function startJourney() {

      startMusic();

      card.innerHTML = `

        <div class="fade">

          <div class="icon">
            📚
          </div>

          <h1>
            الرحلة دي مكانتش سهلة خالص...
          </h1>

          <p>

            خصوصًا إن الموضوع مكانش دراسة بس.

            <br>

            كان فيه شغل، ضغط، امتحانات،

            <br>

            وحاجات كتير بتحصل كلها في نفس الوقت.

          </p>

          <div class="timeline">

            <div class="timeline-item">

              <span class="dot"></span>

              <div class="timeline-text">

                شغل وضغط ومشاكل محتاجة تتعامل معاها كل يوم 💻

              </div>

            </div>

            <div class="timeline-item">

              <span class="dot"></span>

              <div class="timeline-text">

                وفي نفس الوقت مذاكرة وامتحانات و deadlines 📚

              </div>

            </div>

            <div class="timeline-item">

              <span class="dot"></span>

              <div class="timeline-text">

                وأيام أكيد كان نفسك تقفلي كل حاجة وتريحي شوية 😮‍💨

              </div>

            </div>

            <div class="timeline-item">

              <span class="dot"></span>

              <div class="timeline-text">

                بس في الآخر... سلحوفة كملت ❤️

              </div>

            </div>

          </div>

          <button
            class="main-btn"
            onclick="proudMoment()"
          >

            وده اللي مخليني فخور بيكي ❤️

          </button>

        </div>

      `;

      scrollCardIntoView();

    }


    /* ==========================================
       STEP 2 - PROUD
    ========================================== */

    function proudMoment() {

      card.innerHTML = `

        <div class="fade">

          <div class="icon">
            ❤️
          </div>

          <h1>
            أنا بجد فخور بيكي.
          </h1>

          <p>

            مش بس عشان اتخرجتي.

            <br><br>

            عشان أنا عارف إنك كنتي بتحاولي توازني

            <br>

            بين الشغل والدراسة وكل الضغط اللي حواليكي.

            <br><br>

            وعارف إن في أيام مكنتش سهلة،

            <br>

            وإن ساعات كان كل حاجة بتيجي فوق بعض.

            <br><br>

           بس دايما كنتى بتبقى قدها و بتعدى 

            <br><br>

            <span class="highlight">

              وده بالنسبالي أهم من التخرج نفسه.

            </span>

          </p>

          <button
            class="main-btn"
            onclick="futureMoment()"
          >

            ولسه اللي جاي أحلى ✨

          </button>

        </div>

      `;

      scrollCardIntoView();

    }


    /* ==========================================
       STEP 3 - FUTURE
    ========================================== */

    function futureMoment() {

      card.innerHTML = `

        <div class="fade">

          <div class="icon">
            ✨
          </div>

          <h1>
            وأنا واثق فيكي جدًا.
          </h1>

          <p>

            واثق إن التخرج ده مش آخر حاجة حلوة هتحصلك.

            <br><br>

            واثق إنك هتفضلي شطورة،

            <br>

            وهتتعلمي أكتر،

            <br>

            وهتوصلي لحاجات أكبر بكتير.

            <br><br>

            ويمكن اللي جاي يبقى فيه ضغط برضه...

            <br>

            بس خلاص،

            <br>

            عندي دليل إن سلحوفة

            <span class="highlight">

              بتعرف تكمل.

            </span>

            ❤️

          </p>

          <button
            class="main-btn"
            onclick="graduationMoment()"
          >

            يلا نحتفل بقى 🎓

          </button>

        </div>

      `;

      scrollCardIntoView();

    }


    /* ==========================================
       STEP 4 - CELEBRATION
    ========================================== */

    function graduationMoment() {

      createConfetti();

      card.innerHTML = `

        <div class="fade">

          <div class="icon">
            🎓🥳
          </div>

          <h1>
            سلحوفة عملتها 🎓❤️
          </h1>

          <p>

            رسميًا...

            <br>

            خلاص مفيش امتحانات جامعة 😂

            <br><br>

            <span class="highlight">

              سلحوفة اتخرجت ❤️

            </span>

            <br><br>

            وبعد كل اللي فات...

            <br>

            اليوم ده مستاهل نفرح بيه بجد.

          </p>

          <button
            class="main-btn"
            onclick="showCertificate()"
          >

            شوفي شهادة سلحوفة 🎓

          </button>

        </div>

      `;

      scrollCardIntoView();

    }


    /* ==========================================
       CERTIFICATE
    ========================================== */

    function showCertificate() {

      createConfetti();

      card.innerHTML = `

        <div class="fade certificate-wrapper">

          <h1>
            Congratulations 🎓❤️
          </h1>

          <div
            class="certificate"
            id="graduationCertificate"
          >

            <div class="certificate-icon">
              🎓
            </div>

            <div class="certificate-title">

              OFFICIAL GRADUATION MOMENT

            </div>

            <div class="certificate-subtitle">

              SALHOFA GRADUATION EDITION

            </div>

            <div class="certificate-line"></div>

            <div class="certificate-row">

              <span>
                Graduate
              </span>

              <span>
                سلحوفة 🎓❤️
              </span>

            </div>

            <div class="certificate-row">

              <span>
                Achievement
              </span>

              <span>
                University Graduate
              </span>

            </div>

            <div class="certificate-row">

              <span>
                Survived
              </span>

              <span>
                شغل + دراسة + امتحانات 😂
              </span>

            </div>

            <div class="certificate-row">

              <span>
                Proud Level
              </span>

              <span>
                ∞
              </span>

            </div>

            <div class="certificate-row">

              <span>
                Future
              </span>

              <span>
                Bright ✨
              </span>

            </div>

            <div class="certificate-row">

              <span>
                Smart Level
              </span>

              <span>
                شطورة جدًا ❤️
              </span>

            </div>

            <div class="certificate-line"></div>

            <div class="status">

              SHE DID IT ✓

            </div>

            <div class="signature">

              Proudly signed by

              <strong>
                صبارة 🌵
              </strong>

            </div>

          </div>

          <button
            class="save-btn"
            onclick="saveCertificate()"
          >

            Save graduation card 🎓❤️

          </button>

          <div class="small-text">

            احتفظي بيها...

            <br>

            عشان تفتكري إنك عملتيها فعلًا ❤️

          </div>

        </div>

      `;

      scrollCardIntoView();

    }


    /* ==========================================
       MOBILE SCROLL HELPER
    ========================================== */

    function scrollCardIntoView() {

      if (
        window.innerWidth <= 768
      ) {

        setTimeout(
          () => {

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          },
          100
        );

      }

    }


    /* ==========================================
       SAVE CERTIFICATE
    ========================================== */

    async function saveCertificate() {

      const certificate =
        document.getElementById(
          "graduationCertificate"
        );

      if (!certificate) {
        return;
      }

      showToast(
        "بنجهز شهادة سلحوفة 🎓✨"
      );

      try {

        const canvas =
          await html2canvas(
            certificate,
            {

              scale: 3,

              backgroundColor:
                null,

              useCORS:
                true,

              logging:
                false

            }
          );

        const dataURL =
          canvas.toDataURL(
            "image/png"
          );

        canvas.toBlob(

          async (blob) => {

            if (!blob) {

              downloadCertificate(
                dataURL
              );

              return;

            }

            const file =
              new File(
                [blob],
                "salhofa-graduation-card.png",
                {
                  type:
                    "image/png"
                }
              );

            if (
              navigator.canShare
              &&
              navigator.canShare({
                files: [file]
              })
            ) {

              try {

                await navigator.share({

                  files:
                    [file],

                  title:
                    "Salhofa Graduation 🎓❤️",

                  text:
                    "سلحوفة عملتها 🎓❤️"

                });

                showToast(
                  "اتحفظت 🎓❤️"
                );

                return;

              }

              catch (error) {

                if (
                  error.name
                  !==
                  "AbortError"
                ) {

                  console.log(error);

                }

              }

            }

            downloadCertificate(
              dataURL
            );

          },

          "image/png"

        );

      }

      catch (error) {

        console.error(error);

        showToast(
          "حصلت مشكلة في الحفظ 😭"
        );

      }

    }


    function downloadCertificate(
      dataURL
    ) {

      const link =
        document.createElement(
          "a"
        );

      link.download =
        "salhofa-graduation-card.png";

      link.href =
        dataURL;

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      showToast(
        "Graduation card saved 🎓❤️"
      );

    }


    /* ==========================================
       CONFETTI
    ========================================== */

    function createConfetti() {

      const colors = [

        "#f4d77d",

        "#ffffff",

        "#d6b54c",

        "#9db5ff",

        "#f7eed2"

      ];

      for (
        let i = 0;
        i < 110;
        i++
      ) {

        setTimeout(
          () => {

            const confetti =
              document.createElement(
                "span"
              );

            confetti.className =
              "confetti";

            confetti.style.left =
              Math.random()
              *
              100
              +
              "vw";

            confetti.style.background =

              colors[

                Math.floor(

                  Math.random()
                  *
                  colors.length

                )

              ];

            confetti.style.animationDuration =

              2.7
              +
              Math.random()
              *
              3
              +
              "s";

            document.body.appendChild(
              confetti
            );

            setTimeout(
              () => {

                confetti.remove();

              },

              6500
            );

          },

          i * 18

        );

      }

    }


    /* ==========================================
       TOAST
    ========================================== */

    function showToast(
      message
    ) {

      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );

      clearTimeout(
        window.toastTimeout
      );

      window.toastTimeout =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },

          1900
        );

    }

  </script>
